<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=1080">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="typography.css">
<link rel="stylesheet" href="fonts.css">
<title>Matches Coming Up — Foundry</title>
<style>
/* Foundry "Matches Coming Up" (Figma node 2048-5942) — same structure +
   behaviour as screen-comingup-two.html (reuses js/comingup-two.js), resized
   larger for the foundry office. All px are Figma 2× values ÷ 2. */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:1080px;height:1920px;overflow:hidden;
  background:var(--off-black);
  font-family:'CBABeaconSans',sans-serif;
  color:var(--white);
}
.screen{
  /* Figma 2048-5942: pt-320 / px-120 (÷2 → 160 / 60). The tall top padding
     drops the header to match the design (title was sitting too high). */
  width:1080px;height:1920px;padding:160px 60px 60px;
  display:flex;flex-direction:column;gap:50px;
  overflow:hidden;
}
.header-block{display:flex;flex-direction:column;gap:35px;flex-shrink:0;}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;}
.page-title{
  font-size:64px;font-weight:800;line-height:68px;letter-spacing:3.2px;
  color:var(--brand-yellow);
}
.badge{
  background:var(--black);color:var(--brand-yellow);
  font-size:24px;font-weight:800;letter-spacing:1.2px;
  padding:16px;border-radius:6px;
  white-space:nowrap;flex-shrink:0;
}
.header-sub{display:flex;flex-direction:column;gap:20px;}
.div-thick{width:100%;height:16px;background:var(--white);flex-shrink:0;}
.meta-row{
  font-size:48px;font-weight:800;letter-spacing:2.4px;
  color:var(--brand-yellow);
}

/* Primary-match countdown */
.cd-block{display:flex;flex-direction:column;gap:20px;align-items:center;flex-shrink:0;}
.cd-label{font-size:32px;font-weight:700;letter-spacing:3.2px;color:var(--brand-yellow);text-transform:uppercase;text-align:center;}
.cd-clock{font-size:120px;font-weight:800;line-height:1.08;letter-spacing:6px;color:var(--brand-yellow);text-align:center;font-variant-numeric:tabular-nums;}
.cd-kickoff{font-size:32px;font-weight:800;letter-spacing:3.2px;color:var(--brand-yellow);text-transform:uppercase;text-align:center;}

/* Primary match — large avatars */
.match-primary{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-shrink:0;}
.match-secondary{display:flex;align-items:center;justify-content:center;gap:40px;flex-shrink:0;}
.team-col{display:flex;flex-direction:column;align-items:center;gap:30px;flex:1;min-width:0;}
.flag-circle-lg{width:300px;height:300px;border-radius:50%;overflow:hidden;background:#444;flex-shrink:0;}
.flag-circle-md{width:210px;height:210px;border-radius:50%;overflow:hidden;background:#444;flex-shrink:0;}
.flag-circle-lg img,.flag-circle-md img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.team-name-lg{font-size:48px;font-weight:800;letter-spacing:2.4px;color:var(--white);text-transform:uppercase;text-align:center;white-space:nowrap;}
.team-name-md{font-size:30px;font-weight:800;color:var(--white);text-transform:uppercase;text-align:center;white-space:nowrap;} /* H5 — next size down so long names (e.g. BOSNIA & HERZEGOVINA) don't hit the edge */
.vs-big{font-size:48px;font-weight:700;letter-spacing:5.28px;color:var(--white);text-transform:uppercase;flex-shrink:0;width:90px;text-align:center;}
.vs-mid{font-size:48px;font-weight:700;letter-spacing:5.28px;color:var(--white);text-transform:uppercase;flex-shrink:0;width:90px;text-align:center;}

/* Secondary match */
.secondary-block{display:flex;flex-direction:column;gap:40px;flex-shrink:0;}
.secondary-date{font-size:30px;font-weight:800;letter-spacing:3px;color:var(--white);text-transform:uppercase;text-align:center;}
</style>
</head><body>
<div class="screen">
  <div class="header-block">
    <div class="top-row">
      <div class="page-title">Matches<br>Coming Up</div>
      <div class="badge" id="updatedBadge">Just updated</div>
    </div>
    <div class="header-sub">
      <div class="div-thick"></div>
      <div class="meta-row">Group Stage</div>
      <div class="div-thick"></div>
    </div>
  </div>

  <div class="cd-block">
    <div class="cd-label">Live In</div>
    <div class="cd-clock" id="cd-clock">–:–:–</div>
    <div class="cd-kickoff" id="cd-kickoff">–</div>
  </div>

  <div class="match-primary">
    <div class="team-col">
      <div class="flag-circle-lg"><img id="p-flag-home" alt=""></div>
      <div class="team-name-lg" id="p-name-home">–</div>
    </div>
    <div class="vs-big">VS</div>
    <div class="team-col">
      <div class="flag-circle-lg"><img id="p-flag-away" alt=""></div>
      <div class="team-name-lg" id="p-name-away">–</div>
    </div>
  </div>

  <div class="div-thick"></div>

  <div class="secondary-block">
    <div class="secondary-date" id="s-date">–</div>
    <div class="match-secondary">
      <div class="team-col">
        <div class="flag-circle-md"><img id="s-flag-home" alt=""></div>
        <div class="team-name-md" id="s-name-home">–</div>
      </div>
      <div class="vs-mid">VS</div>
      <div class="team-col">
        <div class="flag-circle-md"><img id="s-flag-away" alt=""></div>
        <div class="team-name-md" id="s-name-away">–</div>
      </div>
    </div>
  </div>
</div>
<script src="js/flag-global.js"></script>
<script src="js/comingup-two.js" defer></script>
</body></html>
