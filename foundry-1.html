<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Foundry 1 — Carousel — Tournament Countdown</title>
<link rel="stylesheet" href="tokens.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
/* Off-black matches the foundry screens, so the brief blank iframe during a
   reload is invisible rather than flashing behind the transition. */
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--off-black); }
#screen-frame {
  position: absolute;
  inset: 0;
  width: 1080px;
  height: 1920px;
  border: none;
  transition: opacity 0.4s ease; /* smooth dim when a goal overlay shows */
}
/* Transition cover — same off-black as the screens; faded in to mask the
   iframe reload between carousel slides, then out once the next screen paints.
   Sits below the goal overlay (z-index 100) so goals always show on top. */
#transition-overlay {
  position: absolute;
  inset: 0;
  background: var(--off-black);
  opacity: 0;
  pointer-events: none;
  z-index: 90;
  transition: opacity 0.4s ease;
}
#transition-overlay.fade-in  { opacity: 1; }
#transition-overlay.fade-out { opacity: 0; }
</style>
</head>
<body>
<iframe id="screen-frame" src="screen-tournament-countdown-foundry.html" title="Foundry 1 screen"></iframe>
<!-- Transition cover (off-black) — masks the iframe reload between slides. -->
<div id="transition-overlay"></div>
<!-- Goal overlay: hidden iframe shown on top of the live screen when a goal is
     scored (driven by postMessage from the match-live screen). -->
<iframe id="goal-frame" title="Goal overlay" style="display:none;position:absolute;inset:0;width:1080px;height:1920px;border:none;z-index:100;pointer-events:none;"></iframe>

<script>
// ── Foundry 1 controller ──────────────────────────────────────────────────
// Mirrors the office-1/2 live state machine (index.html): rotate a phase
// carousel while idle, but poll /api/live and flip full-screen to the foundry
// Match Live screen the instant a match goes in-play. Polling ramps to every
// 5 s in the final minute before a scheduled kickoff so we go live ASAP.
//
//   ?demo=1        propagate demo mode to /api/live, /api/upcoming + live screen
//   ?simulate=0|1|2 force a live-match count (2022 fixtures) for offline testing

const CONFIG   = new URLSearchParams(location.search);
const DEMO     = CONFIG.get('demo') === '1' || CONFIG.get('demo') === 'true';
const SIMULATE = CONFIG.get('simulate');

// ── Poll cadences & timing (match office-1/2 in index.html) ───────────────
const IDLE_POLL_MS = 5 * 60 * 1000; // no live match → poll every 5 min
const LIVE_POLL_MS = 10 * 1000;     // match(es) live → poll every 10 s
const LIVE_POLL_SEC = LIVE_POLL_MS / 1000; // passed to the live screen as ?poll=
const SLIDE_DURATION_MS = 45000;    // hold 45 s per carousel screen
// In the final minute before a scheduled kickoff, ramp polling to every 5 s so
// the live screen appears the instant the match goes in-play.
const PREKICKOFF_WINDOW_MS = 60 * 1000;
const PREKICKOFF_POLL_MS   = 5 * 1000;
// ±12% jitter so foundry-1 doesn't poll the API in lockstep with the offices.
const jitter = (ms) => Math.round(ms * (0.88 + Math.random() * 0.24));
// First WC 2026 match: 5:00am AEST, 12 Jun 2026 (= 19:00 UTC, 11 Jun). Used only
// as a fallback target for the pre-kickoff ramp if /api/upcoming is unreachable.
const FIRST_MATCH_KICKOFF = Date.UTC(2026, 5, 11, 19, 0);

// ── Carousel playlists (foundry-branded screens) ──────────────────────────
// Pre-tournament: just the countdown. Once the tournament is underway (first
// match has gone live, or the clock has passed kickoff) the office switches to
// the Recently Completed → Matches Coming Up rotation. Will expand once more
// matches have been played.
const PRE_TOURNAMENT_PLAYLIST = [
  { src: 'screen-tournament-countdown-foundry.html', label: 'Tournament Countdown' },
];
const GROUP_STAGE_PLAYLIST = [
  { src: 'screen-matchcomplete-foundry.html',  label: 'Recently Completed' },
  { src: 'screen-comingup-two-foundry.html',   label: 'Matches Coming Up' },
];

// ── State ─────────────────────────────────────────────────────────────────
const frame = document.getElementById('screen-frame');
let carouselIndex   = 0;
let carouselTimer   = null;
let liveTimer       = null;
let liveMode        = false;   // true while showing the foundry live screen
let currentSrc      = null;    // last src loaded (dedup guard — keeps the live
                               // screen + its synth clock alive across re-polls)
let nextKickoffEpoch = null;   // epoch (ms) of the next scheduled fixture, or null
let firstMatchHasStarted = false; // latches once we ever detect a live match
// Consecutive empty /api/live polls to ride out before leaving a live match
// (×10s ≈ 30s) — keeps the display on Match Live for the whole match.
const LIVE_GRACE_POLLS = 3;
let liveGracePolls = 0;

// The tournament is "underway" once the first match has gone live, or the clock
// has passed the opener (fallback if we never catch a live poll).
function activePlaylist() {
  const started = firstMatchHasStarted || Date.now() >= FIRST_MATCH_KICKOFF;
  return started ? GROUP_STAGE_PLAYLIST : PRE_TOURNAMENT_PLAYLIST;
}

// Navigate the iframe, deduping on src so an unchanged live screen isn't
// reloaded (which would reset its match clock) on every poll.
//
// Smooth transition (mirrors index.html): cover with the off-black overlay,
// swap the src only once the cover is fully opaque, and reveal only after the
// new screen has loaded and painted — so carousel transitions don't flash.
// Foundry screens render from localStorage on their `defer` script (before
// `load`), so cached content is on-screen at reveal time.
const transitionOverlay = document.getElementById('transition-overlay');
let revealFallbackTimer = null;
const COVER_MS = 400; // must match #transition-overlay CSS transition duration
function goTo(src) {
  if (src === currentSrc) return;
  currentSrc = src;
  transitionOverlay.classList.remove('fade-out');
  transitionOverlay.classList.add('fade-in');
  clearTimeout(revealFallbackTimer);
  setTimeout(() => {
    let revealed = false;
    const reveal = () => {
      if (revealed) return;
      revealed = true;
      clearTimeout(revealFallbackTimer);
      transitionOverlay.classList.remove('fade-in');
      transitionOverlay.classList.add('fade-out');
    };
    frame.onload = () => setTimeout(reveal, 60); // brief paint delay before uncovering
    revealFallbackTimer = setTimeout(reveal, 3000); // safety if `load` never fires
    frame.src = src;
  }, COVER_MS);
}

// ── Carousel (idle) ───────────────────────────────────────────────────────
// Re-reads activePlaylist() each tick so the pre-tournament → group-stage
// switch is picked up even without a live match in between.
function advance() {
  const pl = activePlaylist();
  carouselIndex = (carouselIndex + 1) % pl.length;
  goTo(pl[carouselIndex].src);
}
function startCarousel() {
  if (liveMode) liveMode = false;
  const pl = activePlaylist();
  if (carouselIndex >= pl.length) carouselIndex = 0;
  goTo(pl[carouselIndex].src);
  // Always run the slide timer (even for a 1-screen playlist) so a phase change
  // is re-evaluated on the next tick; goTo dedups so a static screen never reloads.
  clearInterval(carouselTimer);
  carouselTimer = setInterval(advance, SLIDE_DURATION_MS);
}

// ── Live ──────────────────────────────────────────────────────────────────
// No foundry pair screen exists, so any live count ≥ 1 shows the single foundry
// Match Live screen pinned to the primary fixture (/api/live sorts Australia
// first), matching office-1's primary pick.
function enterLive(fixtures) {
  liveMode = true;
  clearInterval(carouselTimer);
  carouselTimer = null;
  const primary = fixtures[0];
  const qs = new URLSearchParams();
  qs.set('poll', LIVE_POLL_SEC);
  if (primary?.fixtureId != null) qs.set('fixture', primary.fixtureId);
  if (DEMO) qs.set('demo', '1');
  goTo(`screen-matchlive-foundry.html?${qs}`);
}

// ── Pre-kickoff polling ramp (same logic as index.html) ───────────────────
async function refreshNextKickoff() {
  try {
    const qs = new URLSearchParams();
    if (DEMO) qs.set('demo', '1');
    const res  = await fetch(`/api/upcoming${qs.toString() ? `?${qs}` : ''}`, { cache: 'no-store' });
    const data = await res.json();
    if (data.ok && data.fixture?.kickoffEpoch) {
      nextKickoffEpoch = data.fixture.kickoffEpoch;
      return;
    }
  } catch (_) { /* fall through to fallback */ }
  if (nextKickoffEpoch == null && Date.now() < FIRST_MATCH_KICKOFF) {
    nextKickoffEpoch = FIRST_MATCH_KICKOFF;
  }
}

function nextPollDelay(count) {
  if (count > 0) return LIVE_POLL_MS;
  if (nextKickoffEpoch != null) {
    const msUntilKO     = nextKickoffEpoch - Date.now();
    const msUntilWindow = msUntilKO - PREKICKOFF_WINDOW_MS;
    if (msUntilKO > 0 && msUntilKO <= PREKICKOFF_WINDOW_MS) return PREKICKOFF_POLL_MS;
    if (msUntilWindow > 0 && msUntilWindow < IDLE_POLL_MS)  return msUntilWindow;
  }
  return IDLE_POLL_MS;
}

async function checkLive() {
  let count = 0;
  let fixtures = [];
  try {
    const qs = new URLSearchParams();
    if (SIMULATE != null) qs.set('simulate', SIMULATE);
    if (DEMO) qs.set('demo', '1');
    const res  = await fetch(`/api/live${qs.toString() ? `?${qs}` : ''}`, { cache: 'no-store' });
    const data = await res.json();
    if (data.ok) { count = data.count || 0; fixtures = data.fixtures || []; }
  } catch (e) {
    // Network/API blip — treated as an empty poll, but the grace window below
    // keeps us on the live screen rather than bouncing to the carousel.
    count = 0;
  }

  if (count > 0) firstMatchHasStarted = true; // latch: tournament is underway

  // Stay on Match Live for the WHOLE match. A single empty/failed /api/live poll
  // must not bounce back to the carousel mid-match — only leave once several
  // consecutive empty polls confirm the match is over.
  let inGrace = false;
  if (count >= 1) {
    liveGracePolls = 0;
    enterLive(fixtures);
  } else if (liveMode && liveGracePolls < LIVE_GRACE_POLLS) {
    liveGracePolls += 1;          // hold the live screen through the grace window
    inGrace = true;
  } else {
    liveGracePolls = 0;
    if (liveMode || currentSrc === null) startCarousel();
  }

  // Keep the next-kickoff target fresh when idle (refresh if unknown or past).
  if (count === 0 && !inGrace && (nextKickoffEpoch == null || nextKickoffEpoch <= Date.now())) {
    await refreshNextKickoff();
  }

  // Poll fast while a match is live or during the grace window (to re-confirm).
  liveTimer = setTimeout(checkLive, jitter((count > 0 || inGrace) ? LIVE_POLL_MS : nextPollDelay(count)));
}

// ── Goal overlay ──────────────────────────────────────────────────────────
// The foundry Match Live screen reuses js/match-live.js, which postMessages
// { type:'GOAL', scorer } to its parent on a score change. Show screen-goal
// full-screen over the live screen, then auto-hide — same as office-1/2.
const goalFrame = document.getElementById('goal-frame');
let goalHideTimer = null;

window.addEventListener('message', (e) => {
  if (e.data?.type !== 'GOAL') return;
  showGoalOverlay(e.data.scorer ?? '');
});

function showGoalOverlay(scorerText) {
  if (goalHideTimer) clearTimeout(goalHideTimer); // a second goal mid-animation restarts the timer
  // Dim the live screen to 20% so the goal overlay reads clearly on top.
  frame.style.opacity = '0.2';
  if (!goalFrame.src || !goalFrame.src.includes('screen-goal.html')) {
    goalFrame.src = 'screen-goal.html';
    goalFrame.onload = () => {
      goalFrame.style.display = 'block';
      goalFrame.contentWindow?.triggerGoal?.(scorerText);
    };
  } else {
    goalFrame.style.display = 'block';
    goalFrame.contentWindow?.triggerGoal?.(scorerText);
  }
  // Auto-hide after 12s (matches the goal animation: ~2.2s in + ~8.8s hold + 0.8s out + 0.2s buffer).
  goalHideTimer = setTimeout(() => {
    goalFrame.style.display = 'none';
    frame.style.opacity = '1'; // restore the live screen
  }, 12000);
}

checkLive();
</script>
</body>
</html>
