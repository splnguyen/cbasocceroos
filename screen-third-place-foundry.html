<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=1080">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="typography.css">
<link rel="stylesheet" href="fonts.css">
<title>Match Coming Up (Third Place Play-Off) — Foundry</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:1080px;height:1920px;overflow:hidden;
  background:var(--off-black);
  font-family:'CBABeaconSans',sans-serif;
  color:var(--white);
}
.screen{
  width:1080px;height:1920px;padding:150px 60px 60px;
  display:flex;flex-direction:column;align-items:center;gap:50px;overflow:hidden;
}
.header-block{display:flex;flex-direction:column;gap:60px;flex-shrink:0;width:100%;}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;width:100%;}
.page-title{font-size:64px;font-weight:800;line-height:68px;letter-spacing:3.2px;color:var(--brand-yellow);}
.badge{
  background:var(--black);color:var(--brand-yellow);
  font-size:24px;font-weight:800;letter-spacing:1.2px;
  padding:16px;border-radius:6px;white-space:nowrap;flex-shrink:0;
}
.header-sub{display:flex;flex-direction:column;gap:20px;width:100%;}
.div-thick{width:100%;height:16px;background:var(--white);flex-shrink:0;}
.meta-row{font-size:48px;font-weight:800;letter-spacing:2.4px;color:var(--brand-yellow);}

.cd-block{display:flex;flex-direction:column;gap:50px;align-items:center;flex-shrink:0;width:100%;}
.cd-label{font-size:32px;font-weight:700;line-height:0.7;letter-spacing:3.2px;color:var(--brand-yellow);text-align:center;text-transform:uppercase;}
.cd-clock{font-size:120px;font-weight:800;line-height:0.9;letter-spacing:6px;color:var(--brand-yellow);text-align:center;font-variant-numeric:tabular-nums;}
.cd-kickoff{font-size:32px;font-weight:800;line-height:0.7;letter-spacing:3.2px;color:var(--brand-yellow);text-align:center;text-transform:uppercase;}

.match-block{display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0;width:100%;}
.team-col{width:367px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:30px;}
.flag-circle{width:367px;height:367px;border-radius:50%;overflow:hidden;background:#444;flex-shrink:0;}
.flag-circle img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.flag-circle.tbc{display:flex;align-items:center;justify-content:center;}
.team-name{font-size:48px;font-weight:800;line-height:0.7;letter-spacing:2.4px;color:var(--white);text-transform:uppercase;text-align:center;white-space:nowrap;}
.team-name.tbc{color:var(--mid-grey);}
.vs{font-size:48px;font-weight:400;letter-spacing:5.28px;color:var(--white);text-transform:uppercase;flex-shrink:0;width:84.5px;text-align:center;align-self:center;}
</style>
</head><body>
<div class="screen">
  <div class="header-block">
    <div class="top-row">
      <div class="page-title">Match<br>Coming Up</div>
      <div class="badge" id="updatedBadge">Just updated</div>
    </div>
    <div class="header-sub">
      <div class="div-thick"></div>
      <div class="meta-row">Third Place Play-Off</div>
      <div class="div-thick"></div>
    </div>
  </div>

  <div class="cd-block">
    <div class="cd-label">Live In</div>
    <div class="cd-clock" id="cd-clock">--:--:--</div>
    <div class="cd-kickoff" id="cd-kickoff">Kick-off TBC</div>
  </div>

  <div class="match-block">
    <div class="team-col">
      <div class="flag-circle"><img id="home-flag" alt=""></div>
      <div class="team-name" id="home-name">TBC</div>
    </div>
    <div class="vs">VS</div>
    <div class="team-col">
      <div class="flag-circle tbc"><img id="away-flag" alt=""></div>
      <div class="team-name tbc" id="away-name">TBC</div>
    </div>
  </div>
</div>
<script src="js/flag-global.js"></script>
<script src="js/third-place.js" defer></script>
</body></html>
