<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Foundry 3 — Carousel — Group Status 2 + Top Keepers</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#screen-frame {
  position: absolute;
  inset: 0;
  width: 1080px;
  height: 1920px;
  border: none;
}
</style>
</head>
<body>
<iframe id="screen-frame" src="screen-groupstatus-foundry-2.html" title="Foundry 3 screen"></iframe>

<script src="js/daily-reload.js"></script>
<script>
// ── Foundry 3 carousel ────────────────────────────────────────────────────
// Group stage: Group Status 2 → Top Keepers. Once all groups finish
// (GROUP_STAGE_END, matching index.html) it switches to the knockout rotation:
// Top Scorers → Top Keepers.
const GROUP_STAGE_END = Date.UTC(2026, 5, 28, 7, 0); // 5:00pm AEST 28 Jun
const GROUP_STAGE_PLAYLIST = [
  { src: 'screen-groupstatus-foundry-2.html', label: 'Group Stage Status 2' },
  { src: 'screen-topkeepers-foundry.html',    label: 'Top Keepers' },
];
const KNOCKOUT_PLAYLIST = [
  { src: 'screen-third-place-foundry.html',    label: '3rd Place Playoff' },
  { src: 'screen-topkeepers-foundry.html',    label: 'Top Keepers' },
  { src: 'screen-topscorers-foundry.html',    label: 'Top Scorers' },
];
function activePlaylist() {
  return Date.now() > GROUP_STAGE_END ? KNOCKOUT_PLAYLIST : GROUP_STAGE_PLAYLIST;
}

const SLIDE_DURATION_MS = 45000;
const frame = document.getElementById('screen-frame');
let index = 0;

// Show playlist[i] for the current phase; dedup so an unchanged screen never reloads.
function show(i) {
  const pl = activePlaylist();
  index = i % pl.length;
  if (frame.src.indexOf(pl[index].src) === -1) frame.src = pl[index].src;
}
function advance() { show(index + 1); }

show(0); // correct the hardcoded group-stage src immediately if already knockout
// Re-evaluate every slide so the group-stage → knockout switch is picked up and the
// playlist rotates.
setInterval(advance, SLIDE_DURATION_MS);

// Reload at ~4am AEST daily so deployed changes apply without a manual refresh.
scheduleDailyReload();
</script>
</body>
</html>
