<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=1080">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="typography.css">
<link rel="stylesheet" href="fonts.css">
<title>Latest Matches — Knockout</title>
<!--
  Recently Completed (Knockout) — Figma node 2221-7152. Office-1 knockout
  carousel. Same "Latest Matches" chrome + score line as the group-stage version
  (screen-matchescomplete.html), but each match block carries POST-GAME STATS
  (possession bar + SHOTS / ON TARGET / CORNERS / FOULS cards) instead of group
  tables. Driven by js/matchescomplete-knockout.js.
-->
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:1080px;height:1920px;overflow:hidden;
  background:var(--off-black);
  font-family:'CBABeaconSans',sans-serif;
  color:var(--white);
}
.screen{width:1080px;height:1920px;padding:60px;display:flex;flex-direction:column;overflow:hidden;}

/* ── Header ───────────────────────────────────────────────────────────────── */
.header-block{display:flex;flex-direction:column;gap:40px;flex-shrink:0;}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;}
.page-title{font-size:64px;font-weight:800;line-height:68px;letter-spacing:3.2px;color:var(--brand-yellow);}
.badge{
  background:var(--black);color:var(--brand-yellow);
  font-size:24px;font-weight:800;letter-spacing:1.2px;
  padding:16px;border-radius:6px;white-space:nowrap;flex-shrink:0;
}
.div-thick{width:100%;height:16px;background:var(--white);flex-shrink:0;}

/* ── Match blocks (two completed matches, centred over the page) ──────────── */
/* The two blocks centre as a group; the middle divider's own margin sets the
   space above/below it (was ~105px from space-between, now ~63px ≈ -40%). */
.blocks{display:flex;flex-direction:column;flex:1;min-height:0;justify-content:center;margin-top:36px;}
.blocks > .div-thick{margin:63px 0;}
.match-block{display:flex;flex-direction:column;align-items:center;gap:44px;width:100%;}
.results-empty{color:var(--mid-grey);font-size:32px;text-align:center;margin:auto;}

/* Score line — same treatment as the group-stage Latest Matches (winner white,
   loser mid-grey + desaturated flag). */
.result-date{font-size:32px;font-weight:800;line-height:0.7;letter-spacing:3.2px;color:var(--brand-yellow);text-transform:uppercase;text-align:center;}
.result-row{display:flex;align-items:flex-start;justify-content:center;gap:60px;width:100%;}
.result-team{width:230px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:31px;}
.result-team.loser .result-score{color:var(--mid-grey);}
.result-team.loser .result-name{color:var(--mid-grey);}
.result-team.loser .result-flag img{filter:grayscale(1) opacity(0.55);}
.result-score{font-size:180px;font-weight:800;line-height:0.7;color:var(--white);text-align:center;}
.result-avatar{display:flex;flex-direction:column;align-items:center;gap:28px;}
.result-flag{width:70px;height:70px;border-radius:50%;overflow:hidden;background:#444;flex-shrink:0;}
.result-flag img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.result-name{font-size:30px;font-weight:800;line-height:0.7;letter-spacing:2.4px;color:var(--white);text-transform:uppercase;text-align:center;white-space:nowrap;}
.result-centre{width:200px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:24px;}
.result-centre .vert-seg{width:16px;height:84px;background:var(--dark-grey);flex-shrink:0;}
.result-ft{font-size:60px;font-weight:800;line-height:0.7;letter-spacing:3px;color:var(--white);}

/* Possession bar — winner side white, loser side mid-grey (width = possession). */
.poss-wrap{display:flex;flex-direction:column;gap:18px;width:100%;}
.poss-label{font-size:24px;font-weight:800;letter-spacing:1.2px;color:var(--white);text-align:center;text-transform:uppercase;}
.poss-row{display:flex;align-items:center;gap:20px;width:100%;}
.poss-pct{font-size:24px;font-weight:800;letter-spacing:1.2px;white-space:nowrap;width:96px;color:var(--white);}
.poss-pct.away{text-align:right;}
.poss-pct.loser{color:var(--mid-grey);}
.poss-flag{width:44px;height:44px;border-radius:50%;overflow:hidden;background:#444;flex-shrink:0;}
.poss-flag img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.poss-bar{flex:1;display:flex;height:32px;border-radius:10px;overflow:hidden;}
.poss-seg{height:100%;background:var(--white);}
.poss-seg.loser{background:var(--mid-grey);}

/* Stat cards — four side-by-side: SHOTS / ON TARGET / CORNERS / FOULS. */
.stat-cards{display:flex;gap:24px;width:100%;}
.stat-card{
  flex:1;min-width:0;background:var(--charcoal);border-radius:12px;
  padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:22px;
}
.stat-label{font-size:24px;font-weight:800;letter-spacing:1.44px;color:var(--white);text-align:center;text-transform:uppercase;white-space:nowrap;}
.stat-vals{display:flex;align-items:center;justify-content:space-between;width:100%;}
.stat-vals .stat-h,.stat-vals .stat-a{font-size:48px;font-weight:800;line-height:1;letter-spacing:2.4px;color:var(--white);flex:1;min-width:0;}
.stat-vals .stat-h{text-align:left;}
.stat-vals .stat-a{text-align:right;}
.stat-sep{width:3px;height:34px;background:#d9d9d9;margin:0 8px;flex-shrink:0;}

/* ── Single-match layout — used when only ONE match has been played in the last
   24h. Mirrors the group-stage single recap (screen-matchcomplete.html): score
   line + result text + possession, then a bottom row with TOP PERFORMERS on the
   left and the stat cards STACKED on the right. ───────────────────────────── */
.blocks.single{justify-content:center;}
.recap{display:flex;flex-direction:column;align-items:center;width:100%;gap:50px;}
.recap .result-date{font-size:36px;}
.recap .result-row{gap:50px;align-items:flex-start;}
.recap .result-team{width:300px;gap:30px;}
.recap .result-score{font-size:220px;}
.recap .result-flag{width:120px;height:120px;}
.recap .result-avatar{gap:30px;}
.recap .result-name{font-size:40px;white-space:normal;overflow-wrap:break-word;line-height:1.05;}
.recap .result-centre{width:240px;gap:24px;align-self:center;}
.recap .result-centre .vert-seg{width:18px;height:130px;}
.recap .result-block{display:flex;flex-direction:column;align-items:center;gap:14px;}
.recap .result-ft{font-size:64px;}
.recap .result-line{font-size:30px;font-weight:800;color:var(--white);text-align:center;white-space:nowrap;}
.recap .div-thick{margin:0;}
.recap .poss-wrap{gap:20px;}
.recap .poss-label{font-size:28px;}
.recap .poss-pct{font-size:28px;width:120px;}
.recap .poss-flag{width:56px;height:56px;}
.recap .poss-bar{height:48px;}
/* Bottom row: performers (left) + stacked stat cards (right). */
.bottom-grid{display:grid;grid-template-columns:1fr 380px;gap:24px;width:100%;height:540px;}
.top-performers{background:var(--charcoal);border-radius:16px;padding:30px;display:flex;flex-direction:column;gap:24px;}
.tp-title{font-size:28px;font-weight:800;letter-spacing:1px;color:var(--white);text-transform:uppercase;}
.tp-list{display:flex;flex-direction:column;gap:18px;flex:1;}
.tp-row{background:var(--white);border-radius:12px;padding:10px 24px;display:flex;align-items:center;gap:20px;flex:1;min-height:0;}
.tp-row.loser{background:var(--dark-grey);}
.tp-row.loser .tp-name,.tp-row.loser .tp-stats{color:var(--white);}
.tp-flag{width:56px;height:56px;border-radius:50%;overflow:hidden;background:#444;flex-shrink:0;}
.tp-flag img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.tp-name{font-size:26px;font-weight:800;color:var(--off-black);text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tp-stats{font-size:26px;font-weight:800;color:var(--off-black);white-space:nowrap;}
.tp-empty{color:var(--mid-grey);font-size:24px;text-align:center;margin:auto;}
.stat-stack{display:flex;flex-direction:column;gap:24px;min-width:0;}
.stat-stack .stat-card{flex:1;padding:20px 28px;gap:14px;}
.stat-stack .stat-label{font-size:28px;}
.stat-stack .stat-vals .stat-h,.stat-stack .stat-vals .stat-a{font-size:56px;}
.stat-stack .stat-sep{width:4px;height:44px;}
</style>
</head><body>
<div class="screen">
  <div class="header-block">
    <div class="top-row">
      <div class="page-title">Latest<br>Matches</div>
      <div class="badge" id="updatedBadge">Just updated</div>
    </div>
    <div class="div-thick"></div>
  </div>

  <div class="blocks" id="match-blocks"></div>
</div>
<script src="js/flag-global.js"></script>
<script src="js/matchescomplete-knockout.js" defer></script>
</body></html>
