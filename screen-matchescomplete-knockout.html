<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=1080">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="typography.css">
<link rel="stylesheet" href="fonts.css">
<title>Recently Completed — Knockout</title>
<!--
  Recently Completed (Knockout) — Figma node 2221-7152. Office-1 knockout
  carousel. Same "Latest Matches" chrome + score line as the group-stage version
  (screen-matchescomplete.html), but each match block carries POST-GAME STATS
  (possession bar + SHOTS / ON TARGET / CORNERS / FOULS cards) instead of group
  tables. Driven by js/matchescomplete-knockout.js.
-->
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:1080px;height:1920px;overflow:hidden;
  background:var(--off-black);
  font-family:'CBABeaconSans',sans-serif;
  color:var(--white);
}
.screen{width:1080px;height:1920px;padding:60px;display:flex;flex-direction:column;overflow:hidden;}

/* ── Header ───────────────────────────────────────────────────────────────── */
.header-block{display:flex;flex-direction:column;gap:40px;flex-shrink:0;}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;}
.page-title{font-size:64px;font-weight:800;line-height:68px;letter-spacing:3.2px;color:var(--brand-yellow);}
.badge{
  background:var(--black);color:var(--brand-yellow);
  font-size:24px;font-weight:800;letter-spacing:1.2px;
  padding:16px;border-radius:6px;white-space:nowrap;flex-shrink:0;
}
.div-thick{width:100%;height:16px;background:var(--white);flex-shrink:0;}

/* ── Match blocks (two completed matches, centred over the page) ──────────── */
/* The two blocks centre as a group; the middle divider's own margin sets the
   space above/below it (was ~105px from space-between, now ~63px ≈ -40%). */
.blocks{display:flex;flex-direction:column;flex:1;min-height:0;justify-content:center;margin-top:36px;}
.blocks > .div-thick{margin:63px 0;}
.match-block{display:flex;flex-direction:column;align-items:center;gap:44px;width:100%;}
.results-empty{color:var(--mid-grey);font-size:32px;text-align:center;margin:auto;}

/* Score line — same treatment as the group-stage Latest Matches (winner white,
   loser mid-grey + desaturated flag). */
.result-date{font-size:32px;font-weight:800;line-height:0.7;letter-spacing:3.2px;color:var(--brand-yellow);text-transform:uppercase;text-align:center;}
.result-row{display:flex;align-items:flex-start;justify-content:center;gap:60px;width:100%;}
.result-team{width:230px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:31px;}
.result-team.loser .result-score{color:var(--mid-grey);}
.result-team.loser .result-name{color:var(--mid-grey);}
.result-team.loser .result-flag img{filter:grayscale(1) opacity(0.55);}
.result-score{font-size:180px;font-weight:800;line-height:0.7;color:var(--white);text-align:center;}
.result-avatar{display:flex;flex-direction:column;align-items:center;gap:28px;}
.result-flag{width:70px;height:70px;border-radius:50%;overflow:hidden;background:#444;flex-shrink:0;}
.result-flag img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.result-name{font-size:30px;font-weight:800;line-height:0.7;letter-spacing:2.4px;color:var(--white);text-transform:uppercase;text-align:center;white-space:nowrap;}
.result-centre{width:200px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:24px;}
.result-centre .vert-seg{width:16px;height:84px;background:var(--dark-grey);flex-shrink:0;}
.result-ft{font-size:60px;font-weight:800;line-height:0.7;letter-spacing:3px;color:var(--white);}
/* Shootout score under the PEN tag (pair layout); pulled into the 24px column
   gap so the centre stack doesn't grow vs an FT/AET match. */
.result-pens{font-size:30px;font-weight:800;line-height:1;letter-spacing:1.5px;color:var(--white);margin:-12px 0;font-variant-numeric:tabular-nums;}

/* Possession bar — winner side white, loser side mid-grey (width = possession). */
.poss-wrap{display:flex;flex-direction:column;gap:18px;width:100%;}
.poss-label{font-size:24px;font-weight:800;letter-spacing:1.2px;color:var(--white);text-align:center;text-transform:uppercase;}
.poss-row{display:flex;align-items:center;gap:20px;width:100%;}
.poss-pct{font-size:24px;font-weight:800;letter-spacing:1.2px;white-space:nowrap;width:96px;color:var(--white);}
.poss-pct.away{text-align:right;}
.poss-pct.loser{color:var(--mid-grey);}
.poss-flag{width:44px;height:44px;border-radius:50%;overflow:hidden;background:#444;flex-shrink:0;}
.poss-flag img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.poss-bar{flex:1;display:flex;height:32px;border-radius:10px;overflow:hidden;}
.poss-seg{height:100%;background:var(--white);}
.poss-seg.loser{background:var(--mid-grey);}

/* Stat cards — four side-by-side: SHOTS / ON TARGET / CORNERS / FOULS. */
.stat-cards{display:flex;gap:24px;width:100%;}
.stat-card{
  flex:1;min-width:0;background:var(--charcoal);border-radius:12px;
  padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:22px;
}
.stat-label{font-size:24px;font-weight:800;letter-spacing:1.44px;color:var(--white);text-align:center;text-transform:uppercase;white-space:nowrap;}
.stat-vals{display:flex;align-items:center;justify-content:space-between;width:100%;}
.stat-vals .stat-h,.stat-vals .stat-a{font-size:48px;font-weight:800;line-height:1;letter-spacing:2.4px;color:var(--white);flex:1;min-width:0;}
.stat-vals .stat-h{text-align:left;}
.stat-vals .stat-a{text-align:right;}
.stat-sep{width:3px;height:34px;background:#d9d9d9;margin:0 8px;flex-shrink:0;}

/* ── Single-match layout — used when only ONE match has been played in the last
   24h. A faithful clone of the group-stage single recap (screen-matchcomplete.html):
   score line + result text + possession, then a bottom row with the 8-stat grid
   on the LEFT and TOP PERFORMERS on the RIGHT. All scoped under .recap so it never
   clashes with the dual layout's styles. ──────────────────────────────────── */
.blocks.single{justify-content:flex-start;}
.recap{display:flex;flex-direction:column;width:100%;}
/* score line — top/bottom margins balanced so it sits centred between the header
   divider and the divider below it. */
.recap .score-section{display:flex;align-items:stretch;justify-content:space-between;gap:20px;flex-shrink:0;height:480px;margin-top:34px;}
.recap .team-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:30px;justify-content:space-between;}
.recap .score-num{font-size:300px;font-weight:800;line-height:0.7;color:var(--white);text-align:center;}
.recap .team-col.loser .score-num{color:var(--mid-grey);}
.recap .team-col.loser .team-name{color:var(--mid-grey);}
.recap .team-col.loser .flag-circle img{filter:grayscale(1) opacity(0.55);}
.recap .team-avatar{display:flex;flex-direction:column;align-items:center;gap:30px;}
.recap .flag-circle{width:150px;height:150px;border-radius:50%;overflow:hidden;background:#444;flex-shrink:0;}
.recap .flag-circle img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.recap .team-name{--name-base:42px;font-size:var(--name-base);font-weight:800;color:var(--white);text-transform:uppercase;text-align:center;line-height:1.1;max-width:300px;overflow-wrap:break-word;word-break:break-word;}
.recap .centre-col{width:260px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;}
.recap .vert-seg{width:16px;height:170px;background:var(--dark-grey);flex-shrink:0;}
.recap .result-block{display:flex;flex-direction:column;gap:16px;align-items:center;}
.recap .result-ft{font-size:48px;font-weight:800;color:var(--white);}
.recap .result-line{font-size:30px;font-weight:800;color:var(--white);text-align:center;white-space:nowrap;}
/* Gap below the score line (balances the top margin so the score line is centred
   between the two dividers; also keeps a wrapped 2-line name off the divider). */
.recap .div-thick{margin-top:103px;}
/* possession (home white fill on grey track, exactly like matchcomplete) */
.recap .poss-wrap{display:flex;flex-direction:column;gap:20px;flex-shrink:0;margin-top:79px;}
.recap .poss-label{font-size:24px;font-weight:800;letter-spacing:0.48px;color:var(--white);text-align:center;text-transform:uppercase;}
.recap .poss-row{display:flex;align-items:center;gap:20px;}
.recap .poss-pct{font-size:30px;font-weight:800;letter-spacing:2.4px;white-space:nowrap;}
.recap .poss-pct.home{color:var(--white);}
.recap .poss-pct.away{color:var(--mid-grey);}
.recap .poss-flag{width:60px;height:60px;border-radius:50%;overflow:hidden;background:#444;flex-shrink:0;}
.recap .poss-flag img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.recap .poss-bar{flex:1;display:flex;height:82px;border-radius:10px;overflow:hidden;background:var(--mid-grey);}
.recap .poss-fill-home{height:100%;background:var(--white);}
/* bottom: 8-stat grid (left) + TOP PERFORMERS (right) */
.recap .bottom-grid{display:grid;grid-template-columns:485.5px 454.5px;gap:20px;height:540px;margin-top:60px;flex-shrink:0;}
.recap .stats-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:20px;}
.recap .stat-card{background:var(--charcoal);border-radius:10px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:21px;}
.recap .stat-label{font-size:18px;font-weight:800;letter-spacing:0.9px;color:var(--white);text-align:center;text-transform:uppercase;}
.recap .stat-vals{display:flex;align-items:center;justify-content:space-between;}
.recap .stat-vals .stat-h,.recap .stat-vals .stat-a{font-size:30px;font-weight:800;line-height:1;flex:1;}
.recap .stat-vals .stat-h{text-align:left;color:var(--white);}
.recap .stat-vals .stat-a{text-align:right;color:var(--mid-grey);}
.recap .stat-sep{width:3px;height:34px;background:var(--white);margin:0 8px;flex-shrink:0;}
.recap .top-performers{background:var(--charcoal);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:30px;}
.recap .tp-title{font-size:24px;font-weight:800;letter-spacing:0.48px;color:var(--white);text-transform:uppercase;}
.recap .tp-list{display:flex;flex-direction:column;gap:20px;flex:1;}
.recap .tp-row{background:var(--white);border-radius:10px;padding:8px 20px;display:flex;align-items:center;gap:20px;flex:1;min-height:0;}
.recap .tp-row.loser{background:var(--dark-grey);}
.recap .tp-row.loser .tp-name,.recap .tp-row.loser .tp-stats{color:var(--white);}
.recap .tp-flag{width:50px;height:50px;border-radius:50%;overflow:hidden;background:#444;flex-shrink:0;}
.recap .tp-flag img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.recap .tp-name{font-size:24px;font-weight:800;letter-spacing:0.48px;color:var(--off-black);text-transform:uppercase;flex:1;min-width:0;}
.recap .tp-stats{font-size:24px;font-weight:800;letter-spacing:0.48px;color:var(--off-black);white-space:nowrap;}
.recap .tp-empty{color:var(--mid-grey);font-size:24px;text-align:center;margin:auto;}
</style>
</head><body>
<div class="screen">
  <div class="header-block">
    <div class="top-row">
      <div class="page-title">Recently<br>Completed</div>
      <div class="badge" id="updatedBadge">Just updated</div>
    </div>
    <div class="div-thick"></div>
  </div>

  <div class="blocks" id="match-blocks"></div>
</div>
<script src="js/flag-global.js"></script>
<script src="js/matchescomplete-knockout.js" defer></script>
</body></html>
