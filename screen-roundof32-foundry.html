<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=1080">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="typography.css">
<link rel="stylesheet" href="fonts.css">
<title>Knockout Stage — Foundry</title>
<!--
  Foundry "Knockout Stage" (Round of 32 bracket) — Figma node 2179-6123.
  Reuses js/roundof32.js UNCHANGED (same #grid / #updatedBadge ids and
  .bracket/.brow/.pair/.r16/.h2h-* markup as the office screen-roundof32.html).
  This file only supplies the foundry chrome + foundry-scaled bracket CSS:
    - 160px top pad (Figma pt-320 ÷2) so titles line up across the foundry carousel
    - header compressed to a single 64px "Knockout Stage" title + ONE divider
      (the office uses "State of Play" + a "Knockout Stage" meta between two bars)
    - slightly smaller cards (h-108 ÷2 vs office h-128) + tighter pair gaps to fit
  Same bracket: LEFT = 16 R32 matches in 8 pairs; RIGHT = the 8 R16 matches each
  pair feeds (blank circle + TBC until the R32 winners are known). Winner = white
  tile / dark code; loser = charcoal tile + desaturated flag + grey code.
-->
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:1080px;height:1920px;overflow:hidden;
  background:var(--off-black);
  font-family:'CBABeaconSans',sans-serif;
  color:var(--white);
}
/* Top padding 160px matches the other foundry screens so titles line up across
   the carousel (Figma pt-320 ÷2). */
.screen{width:1080px;height:1920px;padding:160px 60px 60px;display:flex;flex-direction:column;overflow:hidden;}

/* ── Header (compressed vs office: single title + one divider) ─────────────── */
.header-block{display:flex;flex-direction:column;gap:30px;flex-shrink:0;}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;}
.page-title{font-size:64px;font-weight:800;line-height:68px;letter-spacing:3.2px;color:var(--brand-yellow);}
.badge{
  background:var(--black);color:var(--brand-yellow);
  font-size:24px;font-weight:800;letter-spacing:1.2px;
  padding:16px;border-radius:6px;white-space:nowrap;flex-shrink:0;
}
.div-thick{width:100%;height:16px;background:var(--white);flex-shrink:0;}

/* ── Bracket (foundry-scaled — matches office screen-roundof32.html) ───────────
   LEFT column = all 16 Round-of-32 matches (32 teams) in 8 pairs; RIGHT column =
   the 8 Round-of-16 matches each pair feeds, centred against the pair. Equal-width
   columns. Winner = white tile (dark code); loser = charcoal + desaturated flag +
   grey code; R16 tiles stay TBC until R32 winners populate. */
.bracket{
  display:flex;flex-direction:column;justify-content:space-between;
  flex:1;min-height:0;margin-top:40px;
}
.brow{
  display:grid;grid-template-columns:1fr 1fr;column-gap:40px;align-items:center;
}
.pair{display:flex;flex-direction:column;gap:12px;}
.h2h-card{display:flex;align-items:center;gap:12px;}
.h2h-tile{
  flex:1;min-width:0;
  background:var(--charcoal);border-radius:12px;
  padding:7px 14px;
  display:flex;align-items:center;justify-content:center;gap:14px;
}
.h2h-tile.winner{background:var(--white);}
.h2h-flag{
  width:44px;height:44px;border-radius:50%;overflow:hidden;
  background:#444;flex-shrink:0;
}
.h2h-flag img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.h2h-code{
  font-size:24px;font-weight:800;letter-spacing:1.2px;
  color:var(--white);text-transform:uppercase;white-space:nowrap;
}
.h2h-tile.winner .h2h-code{color:var(--charcoal);}
.h2h-tile.loser  .h2h-code{color:var(--mid-grey);}
.h2h-tile.loser  .h2h-flag img{filter:grayscale(1) opacity(0.55);}
.h2h-tile.tbc    .h2h-code{color:var(--mid-grey);}
.h2h-vs{
  font-size:22px;font-weight:800;letter-spacing:0.66px;
  color:var(--white);text-transform:uppercase;
  flex-shrink:0;width:34px;text-align:center;
}
</style>
</head><body>
<div class="screen">
  <div class="header-block">
    <div class="top-row">
      <div class="page-title">Knockout<br>Stage</div>
      <div class="badge" id="updatedBadge">Just updated</div>
    </div>
    <div class="div-thick"></div>
  </div>

  <div class="bracket" id="grid"></div>
</div>
<script src="js/flag-global.js"></script>
<script src="js/roundof32.js" defer></script>
</body></html>
