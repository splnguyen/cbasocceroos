<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="tokens.css">
<title>Socceroos — Carousel Preview</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #111; font-family: system-ui, -apple-system, sans-serif; }

/* ── Layout ── */
.layout { display: flex; height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  width: 280px; flex-shrink: 0;
  background: #181818;
  border-right: 1px solid #2a2a2a;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid #2a2a2a;
  flex-shrink: 0;
}
.sidebar-logo {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
}
.sidebar-logo-icon {
  width: 32px; height: 32px;
  background: var(--color-brand-yellow);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.sidebar-logo-text {
  font-size: 14px; font-weight: 700;
  color: #fff; letter-spacing: 0.5px;
}
.sidebar-logo-sub {
  font-size: 11px; color: #666; letter-spacing: 0.3px;
}
.sidebar-title {
  font-size: 11px; font-weight: 600;
  color: #555; letter-spacing: 1px;
  text-transform: uppercase;
}

/* ── Carousel list ── */
.screen-list {
  flex: 1; overflow-y: auto; padding: 12px 0;
}
.screen-list::-webkit-scrollbar { width: 4px; }
.screen-list::-webkit-scrollbar-track { background: transparent; }
.screen-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

.list-section-label {
  padding: 14px 20px 6px;
  font-size: 10px; font-weight: 700;
  color: #444; letter-spacing: 1.2px;
  text-transform: uppercase;
}

.list-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px;
  cursor: pointer;
  border-left: 3px solid transparent;
  user-select: none;
  transition: background 0.1s;
}
.list-item:hover { background: #222; }
.list-item.active {
  background: #212121;
  border-left-color: var(--color-brand-yellow);
}
.list-item-dot {
  width: 6px; height: 6px;
  border-radius: 50%; background: #3a3a3a; flex-shrink: 0;
}
.list-item.active .list-item-dot { background: var(--color-brand-yellow); }
.list-item-label {
  font-size: 13px; color: #888; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.list-item.active .list-item-label { color: #fff; }
.list-item-tag {
  margin-left: auto;
  font-size: 9px; font-weight: 700;
  color: #555; letter-spacing: 0.8px;
  text-transform: uppercase;
  background: #252525; padding: 2px 6px; border-radius: 3px;
  flex-shrink: 0;
}
.list-item.active .list-item-tag { color: var(--color-brand-yellow); background: #2a2600; }

.list-item.disabled { opacity: 0.3; cursor: default; }

.sidebar-footer {
  padding: 14px 20px;
  border-top: 1px solid #222;
  font-size: 11px; color: #444;
  flex-shrink: 0;
}

/* ── Preview pane ── */
.preview-pane {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  overflow: hidden; position: relative;
  background: #0d0d0d;
}

.portrait-frame {
  position: relative;
  /* Maintain 9:16 at 90vh, matching preview.html */
  height: 90vh;
  width: calc(90vh * 0.5625);
  flex-shrink: 0;
  box-shadow: 0 32px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.06);
  border-radius: 4px;
  overflow: hidden;
  background: #2a2a2a;
}
.portrait-frame iframe {
  width: 1080px; height: 1920px;
  border: none; display: block;
  transform-origin: top left;
  /* Scale set via JS */
}

/* Loading overlay */
.loading-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.15s;
}
.loading-overlay.show { opacity: 1; pointer-events: all; }
.loading-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--color-brand-yellow);
  animation: loadPulse 0.8s ease-in-out infinite alternate;
}
@keyframes loadPulse {
  from { opacity: 0.3; transform: scale(0.8); }
  to   { opacity: 1;   transform: scale(1.2); }
}

/* Screen label below frame */
.frame-label {
  position: absolute; bottom: 16px;
  left: 50%; transform: translateX(-50%);
  font-size: 11px; color: #444; letter-spacing: 0.5px;
  white-space: nowrap;
}

/* ── Multi-frame row (offices, side-by-side) ── */
.frame-row {
  display: flex; gap: 28px;
  align-items: center; justify-content: center;
  width: 100%; height: 100%;
}
.frame-col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.frame-caption {
  font-size: 11px; font-weight: 700; color: #666;
  letter-spacing: 1px; text-transform: uppercase;
}
.frame-status {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: #777; letter-spacing: 0.3px;
  min-height: 18px; max-width: 360px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.frame-status .st-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #3a3a3a; flex-shrink: 0;
}
.frame-status.is-playing .st-dot { background: #46c46a; }
.frame-status.is-paused  .st-dot { background: #888; }
.frame-status.is-live    .st-dot { background: #ff4d4d; animation: stPulse 1s ease-in-out infinite alternate; }
.frame-status .st-state { font-weight: 700; color: #aaa; }
.frame-status.is-live .st-state { color: #ff6b6b; }
.frame-status .st-screen { color: #fff; }
@keyframes stPulse { from { opacity: 0.35; } to { opacity: 1; } }

/* Live tags in the sidebar */
.list-item-tag.live { color: #ff6b6b; background: #2a0000; }
</style>
</head>
<body>
<div class="layout">

  <!-- ── Sidebar ── -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">⚽</div>
        <div>
          <div class="sidebar-logo-text">Socceroos</div>
          <div class="sidebar-logo-sub">Carousel Preview</div>
        </div>
      </div>
      <div class="sidebar-title">Locations</div>
    </div>

    <div class="screen-list" id="screen-list">

      <div class="list-section-label">Foundry</div>

      <div class="list-item" data-src="foundry-1.html" data-label="Foundry 1 — Tournament Countdown">
        <div class="list-item-dot"></div>
        <div class="list-item-label">Foundry 1</div>
        <div class="list-item-tag">TOURN</div>
      </div>

      <div class="list-item" data-src="foundry-2.html" data-label="Foundry 2 — Group Status A–F">
        <div class="list-item-dot"></div>
        <div class="list-item-label">Foundry 2</div>
        <div class="list-item-tag">GRP 1</div>
      </div>

      <div class="list-item" data-src="foundry-3.html" data-label="Foundry 3 — Group Status G–L">
        <div class="list-item-dot"></div>
        <div class="list-item-label">Foundry 3</div>
        <div class="list-item-tag">GRP 2</div>
      </div>

      <div class="list-section-label">Main Office</div>

      <div class="list-item" data-view="office-1">
        <div class="list-item-dot"></div>
        <div class="list-item-label">Main Office 1</div>
        <div class="list-item-tag">OFF 1</div>
      </div>

      <div class="list-item" data-view="office-2">
        <div class="list-item-dot"></div>
        <div class="list-item-label">Main Office 2</div>
        <div class="list-item-tag">OFF 2</div>
      </div>

      <div class="list-item" data-view="both">
        <div class="list-item-dot"></div>
        <div class="list-item-label">Both Offices</div>
        <div class="list-item-tag">1 + 2</div>
      </div>

    </div>

    <div class="sidebar-footer">
      Carousel files — 1080 × 1920 px portrait
    </div>
  </div>

  <!-- ── Preview pane ── -->
  <div class="preview-pane" id="preview-pane">
    <div class="frame-row" id="frame-row"><!-- frames injected by JS --></div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  VIEWS — each list item maps to one or more portrait frames.
//  Office frames load index.html?office=N (the live carousel
//  controller) with chrome=0 so the dev bar is hidden. live:true
//  means we read that office's current state (from the hidden
//  status fields in index.html) and show it under the frame.
// ═══════════════════════════════════════════════════════════════
const VIEWS = {
  'office-1': { label: 'Main Office 1', frames: [
    { src: 'index.html?office=1&chrome=0', caption: 'Office 1', live: true, office: 1 },
  ]},
  'office-2': { label: 'Main Office 2', frames: [
    { src: 'index.html?office=2&chrome=0', caption: 'Office 2', live: true, office: 2 },
  ]},
  'both': { label: 'Both Main Offices', frames: [
    { src: 'index.html?office=1&chrome=0', caption: 'Office 1', live: true, office: 1 },
    { src: 'index.html?office=2&chrome=0', caption: 'Office 2', live: true, office: 2 },
  ]},
};

// Foundry items have no data-view — fall back to their data-src/label.
function resolveView(item) {
  if (item.dataset.view && VIEWS[item.dataset.view]) return VIEWS[item.dataset.view];
  return { label: item.dataset.label, frames: [{ src: item.dataset.src, caption: item.dataset.label, live: false }] };
}

const frameRow = document.getElementById('frame-row');
const pane     = document.getElementById('preview-pane');

// ── Size frames to fit the pane (1 or 2 portrait 9:16 frames) ──────────────
function layout() {
  const cols = Array.from(frameRow.querySelectorAll('.frame-col'));
  if (!cols.length) return;
  const n = cols.length;
  const gap = 28, padX = 48, captionSpace = 64;
  const availW = (pane.clientWidth - padX - gap * (n - 1)) / n;
  const availH = pane.clientHeight - captionSpace;
  const h = Math.min(availH, availW / 0.5625, window.innerHeight * 0.9);
  const w = h * 0.5625;
  cols.forEach(col => {
    const frame  = col.querySelector('.portrait-frame');
    const iframe = col.querySelector('iframe');
    frame.style.height = h + 'px';
    frame.style.width  = w + 'px';
    iframe.style.transform = `scale(${w / 1080})`;
  });
}
window.addEventListener('resize', layout);

// ── Render the selected view ───────────────────────────────────────────────
function renderView(view) {
  frameRow.innerHTML = view.frames.map((f, i) => `
    <div class="frame-col" data-office="${f.office || ''}" data-live="${f.live ? 1 : 0}">
      <div class="portrait-frame">
        <iframe data-idx="${i}" src="${f.src}" title="${f.caption}"></iframe>
        <div class="loading-overlay show"><div class="loading-dot"></div></div>
      </div>
      <div class="frame-caption">${f.caption}</div>
      <div class="frame-status"><span class="st-dot"></span><span class="st-text">${f.live ? 'connecting…' : ''}</span></div>
    </div>`).join('');

  frameRow.querySelectorAll('.frame-col').forEach(col => {
    const iframe  = col.querySelector('iframe');
    const overlay = col.querySelector('.loading-overlay');
    iframe.addEventListener('load', () => { overlay.classList.remove('show'); layout(); });
  });
  layout();
  updateAllStatus();
}

// ── Live status: read each office iframe's hidden status fields ────────────
function readOfficeStatus(iframe) {
  try {
    const doc = iframe.contentDocument;
    if (!doc) return null;
    const get = (id) => doc.getElementById(id)?.textContent?.trim() || '';
    const carousel = get('st-carousel');
    if (!carousel) return null; // not booted yet
    return { carousel, screen: get('st-screen'), mode: get('st-mode') };
  } catch (e) {
    return null; // cross-origin / not ready
  }
}

function setSidebarTag(office, text, isLive) {
  if (!office) return;
  const tag = document.querySelector(`.list-item[data-view="office-${office}"] .list-item-tag`);
  if (!tag) return;
  tag.textContent = text;
  tag.classList.toggle('live', !!isLive);
}

function updateAllStatus() {
  frameRow.querySelectorAll('.frame-col').forEach(col => {
    const statusEl = col.querySelector('.frame-status');
    if (col.dataset.live !== '1') { statusEl.style.display = 'none'; return; }
    statusEl.style.display = '';
    const textEl = statusEl.querySelector('.st-text');
    const office = col.dataset.office;
    const s = readOfficeStatus(col.querySelector('iframe'));

    statusEl.classList.remove('is-live', 'is-playing', 'is-paused');
    if (!s) { textEl.textContent = 'connecting…'; return; }

    const isLive = s.carousel.startsWith('live');
    const isPair = s.carousel.includes('pair');
    statusEl.classList.add(isLive ? 'is-live' : (s.carousel === 'playing' ? 'is-playing' : 'is-paused'));
    const state = isLive ? (isPair ? 'DUAL LIVE' : 'LIVE') : s.carousel.toUpperCase();
    textEl.innerHTML = `<span class="st-state">${state}</span> · <span class="st-screen">${s.screen}</span>`;
    setSidebarTag(office, isLive ? (isPair ? 'PAIR' : 'LIVE') : 'PLAY', isLive);
  });
}
setInterval(updateAllStatus, 2000);

// ── Sidebar selection ──────────────────────────────────────────────────────
const items = document.querySelectorAll('.list-item:not([data-disabled])');
items.forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.list-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    renderView(resolveView(item));
  });
});

// Activate first item (Foundry 1) on load.
items[0]?.classList.add('active');
renderView(resolveView(items[0]));
</script>
</body>
</html>
